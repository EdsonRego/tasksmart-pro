<table class="min-w-full bg-white border border-slate-200 rounded-lg overflow-hidden">
  <thead class="bg-slate-100 border-b border-slate-200">
  <tr>
    <th
      *ngFor="let col of columns"
      class="px-4 py-2 text-left text-sm font-medium text-slate-700"
    >
      {{ col.label }}
    </th>
  </tr>
  </thead>

  <tbody>
  <tr
    *ngFor="let row of data"
    class="border-b border-slate-100 hover:bg-slate-50"
  >
    <td *ngFor="let col of columns" class="px-4 py-2 text-sm text-slate-800">
      {{ row[col.field] }}
    </td>
  </tr>
  </tbody>
</table>
