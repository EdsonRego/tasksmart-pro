<span
  class="px-2 py-0.5 rounded text-xs font-medium"
  [ngClass]="{
    'bg-green-100 text-green-800': type === 'success',
    'bg-yellow-100 text-yellow-700': type === 'warning',
    'bg-red-100 text-red-800': type === 'danger',
    'bg-blue-100 text-blue-800': type === 'info'
  }"
>
  {{ label }}
</span>
