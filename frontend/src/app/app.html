<div class="min-h-screen flex bg-[#F7F7F7] text-[#32363A]">
  <!-- SIDEBAR -->
  <aside
    class="flex flex-col bg-[#0A6ED1] text-white transition-all duration-200 shadow-lg"
    [ngClass]="sidebarCollapsed ? 'w-20' : 'w-64'"
  >
    <!-- Logo / título -->
    <div class="flex items-center gap-2 px-4 h-16 border-b border-white/10">
      <div class="flex items-center justify-center w-8 h-8 rounded bg-white/10">
        <!-- Ícone de atividade -->
        <svg
          class="w-5 h-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M13 3L4 14H12L11 21L20 10H12L13 3Z"></path>
        </svg>
      </div>
      <div *ngIf="!sidebarCollapsed" class="flex flex-col">
        <span class="text-sm font-semibold leading-tight">TaskSmart Pro</span>
        <span class="text-[11px] text-blue-100 leading-tight">
          Painel operacional
        </span>
      </div>
    </div>

    <!-- Navegação -->
    <nav class="flex-1 mt-4 space-y-1 px-2 text-sm">
      <!-- Dashboard -->
      <a
        routerLink="/analytics"
        class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer transition-colors"
      >
        <svg
          class="w-5 h-5 flex-shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 13h8V3H3v10zM13 21h8V11h-8v10zM13 3v6h8V3h-8zM3 21h8v-6H3v6z"></path>
        </svg>
        <span *ngIf="!sidebarCollapsed">Dashboard</span>
      </a>

      <!-- Ordens de Serviço -->
      <a
        routerLink="/work-orders"
        class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer transition-colors"
      >
        <svg
          class="w-5 h-5 flex-shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
          <path d="M7 8h10M7 12h6M7 16h4"></path>
        </svg>
        <span *ngIf="!sidebarCollapsed">Ordens de Serviço</span>
      </a>

      <!-- Clientes / Usuários -->
      <a
        routerLink="/users"
        class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer transition-colors"
      >
        <svg
          class="w-5 h-5 flex-shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="3"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span *ngIf="!sidebarCollapsed">Clientes</span>
      </a>

      <!-- Relatórios -->
      <a
        routerLink="/reports"
        class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer transition-colors"
      >
        <svg
          class="w-5 h-5 flex-shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3v18h18"></path>
          <path d="M7 14l4-4 3 3 5-7"></path>
        </svg>
        <span *ngIf="!sidebarCollapsed">Relatórios</span>
      </a>

      <!-- Configurações -->
      <a
        routerLink="/settings"
        class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer transition-colors"
      >
        <svg
          class="w-5 h-5 flex-shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83
            2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1
            .6 1.65 1.65 0 0 0-.33 1.82l-.01.08a2 2 0 0 1-3.32
            0l-.01-.08A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82-.33l-.08.03a1.65
            1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.33 1.82l-.06.06a2 2 0 1
            1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65
            0 0 0-.6-1 1.65 1.65 0 0 0-1.82-.33l-.08.03a2 2 0 0
            1-2.34-3.1l.06-.06A1.65 1.65 0 0 0 4.6 9a1.65 1.65
            0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1
            1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65
            0 0 0 1-.6 1.65 1.65 0 0 0 .33-1.82l.01-.08a2 2 0 0
            1 3.32 0l.01.08A1.65 1.65 0 0 0 15 4.6a1.65 1.65
            0 0 0 1.82.33l.08-.03a2 2 0 0 1 2.34 3.1l-.06.06A1.65
            1.65 0 0 0 19.4 9c.33.29.56.67.67 1.09.11.42.11.86
            0 1.28a1.65 1.65 0 0 0-.67 1.63z"
          ></path>
        </svg>
        <span *ngIf="!sidebarCollapsed">Configurações</span>
      </a>
    </nav>

    <!-- Rodapé da sidebar -->
    <div class="px-3 py-3 border-t border-white/10 mt-auto flex items-center justify-between">
      <!-- Botão de colapsar -->
      <button
        type="button"
        class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-white/20 transition-colors"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed ? 'Expandir menu' : 'Recolher menu'"
      >
        <svg
          class="w-4 h-4"
          [ngClass]="sidebarCollapsed ? 'rotate-180' : ''"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 18l6-6-6-6"></path>
        </svg>
      </button>

      <div *ngIf="!sidebarCollapsed" class="text-[11px] text-blue-100">
        v0.1 · Dev
      </div>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- HEADER -->
    <header
      class="h-16 px-6 border-b border-slate-200 flex items-center justify-between bg-white"
    >
      <!-- Breadcrumb + título -->
      <div class="flex flex-col">
        <span class="text-xs text-slate-500">Painel • Ambiente Dev</span>
        <span class="text-lg font-semibold text-slate-800">
          {{ appName }}
        </span>
      </div>

      <!-- Usuário -->
      <div class="flex items-center gap-4">
        <div class="hidden md:flex flex-col items-end">
          <span class="text-sm font-medium text-slate-800">Edson Rego</span>
          <span class="text-xs text-slate-500">System Support Engineer</span>
        </div>
        <div
          class="w-9 h-9 rounded-full bg-[#0A6ED1] text-white flex items-center justify-center text-sm font-semibold shadow"
        >
          ER
        </div>
      </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <main class="flex-1 p-6 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
