server:
  port: 8089

spring:
  application:
    name: meter-reading-service

  datasource:
    url: jdbc:postgresql://${METER_DB_HOST:localhost}:${METER_DB_PORT:5440}/${METER_DB_NAME:meterreading_db}
    username: ${METER_DB_USER:meter}
    password: ${METER_DB_PASS:meter123}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
