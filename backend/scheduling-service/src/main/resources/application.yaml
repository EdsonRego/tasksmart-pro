server:
  port: 8090

spring:
  application:
    name: scheduling-service

  datasource:
    url: jdbc:postgresql://${SCHEDULING_DB_HOST:localhost}:${SCHEDULING_DB_PORT:5439}/${SCHEDULING_DB_NAME:scheduling_db}
    username: ${SCHEDULING_DB_USER:scheduling}
    password: ${SCHEDULING_DB_PASS:scheduling123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

logging:
  level:
    root: INFO
    org.springframework.scheduling: INFO
