server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - RemoveHopByHopHeaders=authorization,connection,keep-alive,proxy-authenticate,proxy-authorization,te,trailers,transfer-encoding,upgrade
      routes:
        # AUTH-SERVICE
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # TENANT-SERVICE
        - id: tenant-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/tenants/**
          filters:
            - StripPrefix=1

        # CHECKLIST-SERVICE
        - id: checklist-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/checklists/**
          filters:
            - StripPrefix=1

        # WORKORDER-SERVICE
        - id: workorder-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/workorders/**
          filters:
            - StripPrefix=1

        # NOTIFICATION-SERVICE
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

      # CORS básico (ajusta depois conforme necessidade)
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

routes:
  # ...
  - id: asset-service
    uri: http://localhost:8086
    predicates:
      - Path=/api/assets/**,/api/asset-categories/**
    filters:
      - StripPrefix=1