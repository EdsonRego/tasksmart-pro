server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - RemoveHopByHopHeaders=authorization,connection,keep-alive,proxy-authenticate,proxy-authorization,te,trailers,transfer-encoding,upgrade

      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: tenant-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/tenants/**
          filters:
            - StripPrefix=1

        - id: checklist-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/checklists/**
          filters:
            - StripPrefix=1

        - id: workorder-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/workorders/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        - id: asset-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/assets/**,/api/asset-categories/**
          filters:
            - StripPrefix=1

        - id: inventory-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1

        - id: maintenance-plan-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/maintenance-plans/**
          filters:
            - StripPrefix=1

logging:
  level:
    root: INFO
