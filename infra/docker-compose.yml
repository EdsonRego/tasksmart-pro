version: "3.9"

services:

  # =====================================================================
  # AUTH-SERVICE DATABASE
  # =====================================================================
  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =====================================================================
  # TENANT-SERVICE DATABASE
  # =====================================================================
  tenant-db:
    image: postgres:16
    container_name: tenant-db
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant123
      POSTGRES_DB: tenants_db
    ports:
      - "5434:5432"
    volumes:
      - tenant_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =====================================================================
  # WORKORDER-SERVICE DATABASE
  # =====================================================================
  workorder-db:
    image: postgres:16
    container_name: workorder-db
    environment:
      POSTGRES_USER: workorder
      POSTGRES_PASSWORD: work123
      POSTGRES_DB: workorder_db
    ports:
      - "5435:5432"
    volumes:
      - workorder_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =====================================================================
  # NOTIFICATION-SERVICE DATABASE
  # =====================================================================
  notification-db:
    image: postgres:16
    container_name: notification-db
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notif123
      POSTGRES_DB: notification_db
    ports:
      - "5436:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =====================================================================
  # ASSET-SERVICE DATABASE
  # =====================================================================
  asset-db:
    image: postgres:16
    container_name: asset-db
    environment:
      POSTGRES_USER: asset
      POSTGRES_PASSWORD: asset123
      POSTGRES_DB: asset_db
    ports:
      - "5437:5432"
    volumes:
      - asset_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =====================================================================
  # INVENTORY-SERVICE DATABASE
  # =====================================================================
  inventory-db:
    image: postgres:16
    container_name: inventory-db
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory123
      POSTGRES_DB: inventory_db
    ports:
      - "5438:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =====================================================================
  # CHECKLIST-SERVICE DATABASE (MONGO)
  # =====================================================================
  mongo:
    image: mongo:7
    container_name: checklist-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tasksmart-net

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root123
      ME_CONFIG_MONGODB_URL: mongodb://root:root123@mongo:27017/
    ports:
      - "8085:8081"
    depends_on:
      - mongo
    networks:
      - tasksmart-net

  # =====================================================================
  # REDIS (used by notification-service)
  # =====================================================================
  redis:
    image: redis:7
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - tasksmart-net

  # =====================================================================
  # KAFKA + ZOOKEEPER (for future asynchronous events)
  # =====================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - tasksmart-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: |
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - tasksmart-net

  # =====================================================================
  # PGADMIN - Manage All Postgres Instances
  # =====================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tasksmart.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - auth-db
      - tenant-db
      - workorder-db
      - notification-db
      - asset-db
      - inventory-db
    networks:
      - tasksmart-net

# =====================================================================
# VOLUMES
# =====================================================================
volumes:
  auth_data:
  tenant_data:
  workorder_data:
  notification_data:
  asset_data:
  inventory_data:
  mongo_data:
  maintenance_plan_data:

# =====================================================================
# NETWORK
# =====================================================================
networks:
  tasksmart-net:
    driver: bridge

  # =====================================================================
  # MAINTENANCE-PLAN-SERVICE DATABASE
  # =====================================================================
  maintenance-plan-db:
    image: postgres:16
    container_name: maintenance-plan-db
    environment:
      POSTGRES_USER: ${MP_DB_USER}
      POSTGRES_PASSWORD: ${MP_DB_PASS}
      POSTGRES_DB: ${MP_DB_NAME}
    ports:
      - "5439:5432"
    volumes:
      - maintenance_plan_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net