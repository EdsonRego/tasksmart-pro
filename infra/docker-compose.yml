version: "3.9"

services:

  # =======================
  # POSTGRES - AUTH SERVICE
  # =======================
  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =========================
  # POSTGRES - TENANT SERVICE
  # =========================
  tenant-db:
    image: postgres:16
    container_name: tenant-db
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant123
      POSTGRES_DB: tenants_db
    ports:
      - "5434:5432"
    volumes:
      - tenant_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # =======================
  # MONGO - CHECKLIST
  # =======================
  mongo:
    image: mongo:7
    container_name: checklist-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tasksmart-net

  # =======================
  # MONGO EXPRESS (UI)
  # =======================
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root123
      ME_CONFIG_MONGODB_URL: mongodb://root:root123@mongo:27017/
    ports:
      - "8085:8081"
    networks:
      - tasksmart-net
    depends_on:
      - mongo

  # =======================
  # REDIS - FUTURO NOTIF.
  # =======================
  redis:
    image: redis:7
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - tasksmart-net

  # =======================
  # KAFKA + ZOOKEEPER
  # =======================
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - tasksmart-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - tasksmart-net

  # =======================
  # PGADMIN
  # =======================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tasksmart.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - tasksmart-net
    depends_on:
      - auth-db
      - tenant-db

# =======================
# VOLUMES
# =======================
volumes:
  auth_data:
  tenant_data:
  mongo_data:

# =======================
# NETWORK
# =======================
networks:
  tasksmart-net:
    driver: bridge
