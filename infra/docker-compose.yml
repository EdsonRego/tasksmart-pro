version: '3.9'

services:

  # -----------------------------------------------------
  # PostgreSQL
  # -----------------------------------------------------
  postgres:
    image: postgres:16
    container_name: tasksmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasksmart
      POSTGRES_PASSWORD: tasksmart123
      POSTGRES_DB: tasksmart_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tasksmart-net

  # -----------------------------------------------------
  # pgAdmin
  # -----------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tasksmart-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tasksmart.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - tasksmart-net

  # -----------------------------------------------------
  # MongoDB
  # -----------------------------------------------------
  mongo:
    image: mongo:7
    container_name: tasksmart-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: tasksmart
      MONGO_INITDB_ROOT_PASSWORD: tasksmart123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tasksmart-net

  # -----------------------------------------------------
  # Redis
  # -----------------------------------------------------
  redis:
    image: redis:7
    container_name: tasksmart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tasksmart-net

  # -----------------------------------------------------
  # Zookeeper
  # -----------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: tasksmart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - tasksmart-net

  # -----------------------------------------------------
  # Kafka
  # -----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: tasksmart-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - tasksmart-net

# -----------------------------------------------------
# Networks & Volumes
# -----------------------------------------------------
networks:
  tasksmart-net:

volumes:
  postgres_data:
  mongo_data:
