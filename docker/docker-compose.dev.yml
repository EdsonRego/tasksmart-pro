version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ts-postgres
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
      POSTGRES_DB: tasksmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tasksmart

  redis:
    image: redis:7
    container_name: ts-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tasksmart

networks:
  tasksmart:
    driver: bridge

volumes:
  postgres_data:
