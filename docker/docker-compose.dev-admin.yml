version: "3.9"

services:

  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: ts-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: dev-admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tasksmart
      DB_USERNAME: dev_user
      DB_PASSWORD: dev_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    ports:
      - "8081:8081"
    networks:
      - tasksmart

  user-service:
    build:
      context: ../backend/user-service
      dockerfile: Dockerfile
    container_name: ts-user-service
    environment:
      SPRING_PROFILES_ACTIVE: dev-admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tasksmart
      DB_USERNAME: dev_user
      DB_PASSWORD: dev_pass
    depends_on:
      - postgres
    ports:
      - "8082:8082"
    networks:
      - tasksmart

  analytics-service:
    build:
      context: ../backend/analytics-service
      dockerfile: Dockerfile
    container_name: ts-analytics-service
    environment:
      SPRING_PROFILES_ACTIVE: dev-admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tasksmart
      DB_USERNAME: dev_user
      DB_PASSWORD: dev_pass
      WORK_ORDER_URL: http://work-order-service:8083
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      - postgres
      - user-service
      - work-order-service
    ports:
      - "8085:8085"
    networks:
      - tasksmart

  work-order-service:
    build:
      context: ../backend/work-order-service
      dockerfile: Dockerfile
    container_name: ts-work-order-service
    environment:
      SPRING_PROFILES_ACTIVE: dev-admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tasksmart
      DB_USERNAME: dev_user
      DB_PASSWORD: dev_pass
    depends_on:
      - postgres
    ports:
      - "8083:8083"
    networks:
      - tasksmart

  notification-service:
    build:
      context: ../backend/notification-service
      dockerfile: Dockerfile
    container_name: ts-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: dev-admin
      SMTP_HOST: smtp.example.com
      SMTP_USER: test@example.com
      SMTP_PASS: 123456
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      - user-service
    ports:
      - "8086:8086"
    networks:
      - tasksmart

  admin-service:
    build:
      context: ../backend/admin-service
      dockerfile: Dockerfile
    container_name: ts-admin-service
    environment:
      SPRING_PROFILES_ACTIVE: dev-admin
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      ANALYTICS_SERVICE_URL: http://analytics-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      - auth-service
      - user-service
      - analytics-service
      - notification-service
    ports:
      - "8089:8089"
    networks:
      - tasksmart

  gateway-service:
    build:
      context: ../backend/gateway-service
      dockerfile: Dockerfile
    container_name: ts-gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev-admin
      ADMIN_SERVICE_URL: http://admin-service:8089
      ANALYTICS_SERVICE_URL: http://analytics-service:8085
      WORK_ORDER_SERVICE_URL: http://work-order-service:8083
      USER_SERVICE_URL: http://user-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      - admin-service
      - analytics-service
      - work-order-service
      - user-service
    ports:
      - "8080:8080"
    networks:
      - tasksmart

networks:
  tasksmart:
    external: true
